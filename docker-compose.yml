version: "3.8"

services:
  localrss:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./data:/data
    environment:
      - RSS_DB=/data/rss.db
      - RSS_PORT=8787
      - ADMIN_USERNAMES=downes
    expose:
      - "8787"
    networks:
      - web

networks:
  web:
    external: true
