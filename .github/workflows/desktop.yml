name: Standalone desktop releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create isolated build environment
        run: |
          python -m venv .venv
          python -c "import os; from pathlib import Path; scripts = Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'); handle = Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8'); handle.write(str(scripts) + '\n'); handle.close()"
      - name: Install build dependencies
        run: python -m pip install --no-cache-dir --only-binary=cryptography -r requirements-standalone.txt
      - name: Check isolated Python and OpenSSL versions
        run: |
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'Build must use the isolated virtual environment'; print('Python:', sys.executable)"
          python -c "import ssl; from cryptography.hazmat.backends.openssl.backend import backend; print('Python OpenSSL:', ssl.OPENSSL_VERSION); print('Cryptography OpenSSL:', backend.openssl_version_text())"
      - name: Run backend and desktop tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check source startup without user data or network harvesting
        run: python desktop_launcher.py --self-test
      - name: Build executable and test packaged HTTP startup
        run: python build_standalone.py
      - name: Package download
        run: python package_standalone.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: LocalRSS-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: LocalRSS-*
          path: release-assets
          merge-multiple: true
      - name: Publish tested desktop downloads
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: LocalRSS Desktop (${{ github.run_number }})
          make_latest: true
          body: |
            Standalone LocalRSS for Windows, Linux, Intel Macs and Apple Silicon Macs.
            Download your platform archive, extract it, and run LocalRSS.
            Python, SSH access and a VPS are not required. Sign in using the existing kvstore login.
            Keep the launcher window open while reading; Ctrl+C stops the local service.
            These builds are not publisher-signed or Apple-notarized. Check your operating system's normal security prompts.
            Instructions: https://github.com/Downes/localrss_reader/blob/main/README_DESKTOP.md
            Built from ${{ github.sha }}. Each executable passed its local HTTP/assets/authentication smoke check.
          files: release-assets/*
          fail_on_unmatched_files: true
