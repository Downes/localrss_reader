<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Local RSS</title>
  <style>
[hidden]{display:none !important;}


:root{
  --app-bg:#f5f6f8;
  --panel-bg:#ffffff;
  --panel-border:#d7dde8;
  --text:#111827;
  --muted:#4b5563;
  --muted2:#6b7280;
  --shadow: 0 8px 24px rgba(17,24,39,0.08);
  --shadow-sm: 0 2px 10px rgba(17,24,39,0.08);
  --radius: 14px;
  --radius-sm: 6px;
  --accent:#2563eb;
  --accent-2:#1d4ed8;
  --danger:#b91c1c;
  --danger-2:#991b1b;
}

*{ box-sizing:border-box; }

html, body { height:100%; }

body{
  margin:0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
  color: var(--text);
  background: var(--app-bg);
}

    #toolbar { display:flex; gap:6px; align-items:center; margin-bottom:5px; flex-wrap: wrap; }
    #status { color:#555; min-width: 255px; }
    .item { padding: 8px; border-bottom: 1px solid #ddd; }
    .item.selected { box-shadow: 0 0 0 2px rgba(37,99,235,0.5) inset; }
    .title { cursor: pointer; }
    .meta { color:#666; font-size: 12px; display:flex; gap:10px; align-items:center; }
    .content { margin-top: 8px; display:none; }
    .content.expanded { display:block; }
    .star { cursor:pointer; margin-left:8px; user-select:none; }
    .pill { font-size:12px; padding:2px 6px; border:1px solid #ccc; border-radius:999px; color:#444; }
    .danger { border-color: #cc6666; }
    .collapseBtn { font-size: 12px; padding: 2px 6px; }
    progress { width: 280px; height: 14px; }
  
    
    /* Images inside feed entries: responsive + max 500px width */
    .content img {
      max-width: min(500px, 100%);
      height: auto;
      display: inline-block;
      cursor: zoom-in;
    }

    /* Shell layout */
    body { margin: 0; }

    /* Ensure toolbar looks good in sidebar */
    #toolbar { margin-bottom: 10px; }

    /* ===== Two-pane layout (push sidebar) ===== */
    body {
      margin: 0;
      display: flex;
      overflow: hidden;
      height: 100vh;
    }
    #topnav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 3000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      box-shadow: var(--shadow-sm);
      box-sizing: border-box;
    }
    #hamburger {
      font-size: 18px;
      line-height: 18px;
      padding: 6px 10px;
      border: 1px solid #bbb;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }
    #backdrop {
      display: none;
    }
    #sidebar {
      position: relative;
      top: 0;
      left: 0;
      height: calc(100vh - 55px);
      margin-top: 55px;
      font-size: 12px;
      width: 400px;
      flex-shrink: 0;
      box-sizing: border-box;
      padding: 0;
      overflow: auto;
      background: #fff;
      border-right: 1px solid #ddd;
      margin-left: -400px;
      transition: margin-left 160ms ease;
    }

    .sidebar-inner{
      box-sizing:border-box;
      padding: 12px;
    }
    .sidebar-section{
      margin-bottom: 18px;
    }
    .hint{ font-size:12px; color:#666; margin-top:3px; }
    .label{ display:block; font-size:12px; color:#444; margin-bottom:2px; }
    .row{ margin-bottom:4px; }

    .sidebar-title{
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 5px 0;
    }
    .io-row{
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 5px;
      align-items: center;
      margin: 4px 0;
    }
    .io-label{
      font-size: 13px;
      color: #444;
    }
    .io-actions{
      display:flex;
      gap:5px;
      align-items:center;
      flex-wrap: wrap;
      margin-top: 5px;
    }
    @keyframes editor-highlight {
      0%   { box-shadow: 0 0 0 3px var(--accent); background: #eff6ff; }
      70%  { box-shadow: 0 0 0 3px var(--accent); background: #eff6ff; }
      100% { box-shadow: none; background: transparent; }
    }
    #feedEditor.highlight {
      border-radius: var(--radius-sm);
      animation: editor-highlight 1.6s ease forwards;
    }
    .sidebar-footer{ margin-top:6px; padding:5px 6px; font-size:12px; color:#555; border-top:1px solid var(--panel-border); }
    #mainPane {
      flex: 1;
      height: calc(100vh - 55px);
      margin-top: 55px;
      overflow: auto;
      box-sizing: border-box;
      padding: 12px;
      padding-top: 2px;
    }
    body.sidebar-open #sidebar {
      margin-left: 0;
    }
/* Toolbar layout inside sidebar */
    #toolbar { display:flex; gap:6px; align-items:center; margin-bottom:5px; flex-wrap: wrap; }




button, input, select, textarea {
  font: inherit;
}



/* Sidebar polish */
#sidebar{
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  border-right: 1px solid var(--panel-border);
}

.sidebar-inner{
  padding: 5px;
  padding-top: 1px;
}

.sidebar-section{
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  padding: 5px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 6px;
}

.sidebar-title{
  font-size: 12px;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: #fff;
  background: #616a78;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  margin: 0 0 5px 0;
}

.label{
  color: var(--muted);
}

.label.label-strong{
  color: var(--text);
  font-weight: 600;
}

.hint{ color: var(--muted2); }

/* :not() rather than a type allowlist so every text-like input (text, url, search, ...)
   gets the same look automatically - a missed type here is what caused "Add new feed"
   and "Find / update feed" to look different from each other before. */
#sidebar input:not([type="checkbox"]):not([type="hidden"]),
#sidebar select,
#sidebar textarea{
  width: 100%;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  padding: 3px 5px;
  background: var(--app-bg);
}

#sidebar button{
  font-size: 12px;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  padding: 3px 5px;
  background: #fff;
  box-shadow: 0 2px 0 rgba(17,24,39,0.075);
  cursor: pointer;
  position: relative;
  top: 0;
}

#sidebar button:hover{ background: #f8fafc; }

#sidebar button:active{
  box-shadow: 0 0 0 rgba(17,24,39,0.075);
  top: 2px;
}

#sidebar button:disabled{
  opacity: .55;
  cursor: not-allowed;
}

#sidebar button.primary{
  background: #e5e7eb;
  color: #333;
  border-color: var(--panel-border);
}

#sidebar button.primary:hover{
  background: #d1d5db;
}

#sidebar button.danger{
  background: linear-gradient(180deg, var(--danger), var(--danger-2));
  color: #fff;
  border-color: rgba(185,28,28,0.85);
}

#sidebar button.danger:hover{ filter: brightness(0.98); }

/* Main pane polish */
#mainPane{
  background: var(--app-bg);
}


#status2 { color: #555; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
#counts2 { white-space: nowrap; flex-shrink: 0; }
#dbpath { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }

.pill{
  background:#eef2ff;
  border: 1px solid rgba(37,99,235,0.25);
  border-radius: 999px;
}

/* Transient status messages (e.g. "Enter a URL first.") - a plain box distinct
   from the pill-shaped badges above, and invisible with no border/padding
   until there's actually a message to show. */
.status-msg{
  font-size: 12px;
  color: #444;
}
.status-msg:not(:empty){
  padding: 1px 5px;
  border: 1px solid #ccc;
  border-radius: 3px;
  background: #f3f4f6;
}

/* Entry cards */
.item{
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  margin: 10px 0;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
}
.item:first-child{ margin-top: 0; }

.item.selected{
  box-shadow: 0 0 0 2px rgba(37,99,235,0.5) inset, var(--shadow-sm);
}

.title{
  font-weight: 400;
}

.title.unread{
  font-weight: 650;
}

.feed-thumb{
  width: 16px;
  height: 16px;
  object-fit: cover;
  border-radius: 3px;
  vertical-align: -3px;
  margin-right: 5px;
}

.meta{
  color: var(--muted2);
}

/* Mobile responsive styles */
@media (max-width: 768px) {
  /* Larger hamburger button */
  #hamburger {
    font-size: 24px;
    line-height: 24px;
    padding: 12px 16px;
  }

  /* Full-width sidebar on mobile */
  #sidebar {
    width: 100vw;
    margin-left: -100vw;
  }

  /* Larger base font size */
  body {
    font-size: 16px;
  }

  /* Larger titles */
  .title {
    font-size: 16px;
    line-height: 1.4;
  }

  /* Larger metadata text */
  .meta {
    font-size: 14px;
  }

  /* Larger buttons */
  button {
    font-size: 16px;
    padding: 12px 16px;
    min-height: 44px;
  }

  /* Larger form controls */
  input, select, textarea {
    font-size: 16px;
    padding: 12px;
    min-height: 44px;
  }

  /* Larger sidebar sections */
  .sidebar-inner {
    padding: 16px;
  }

  .sidebar-title {
    font-size: 14px;
  }

  /* Larger touch targets for stars and bookmarks */
  .star {
    font-size: 20px;
    padding: 8px;
  }

  /* More spacing for items */
  .item {
    padding: 16px;
    margin: 12px 0;
  }

  /* Larger topnav text */
  #topnav {
    font-size: 14px;
    height: 56px;
  }

  .pill {
    font-size: 14px;
    padding: 4px 8px;
  }
}

</style>
</head>

    <span class="pill" id="dbpath">DB: …</span>

  </div>
  <div id="backdrop" class="sidebar-backdrop" aria-hidden="true" hidden></div>

  <aside id="sidebar" class="sidebar" aria-hidden="true" aria-label="Options">
    <div class="sidebar-inner">
<div class="sidebar-section">
  <h2 class="sidebar-title">Database</h2>

  <script>

let items = [];
let selected = 0;
let expandedId = null;

let jobId = null;
let progressTimer = null;
let _openFeedEditor = null;
let _refreshErrorFeeds = null;
let _openSidebar = null;
let _expandErrorFeeds = null;

// Sidebar: start collapsed; hamburger toggles open/closed.
// ===== Sidebar overlay (single-source-of-truth: body.sidebar-open) =====
function initSidebar() {
  const body = document.body;
  const btn = document.getElementById("hamburger");
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("backdrop");
  if (!btn || !sidebar || !backdrop) return;

  function setOpen(open) {
    body.classList.toggle("sidebar-open", open);
    backdrop.hidden = !open;

    btn.setAttribute("aria-expanded", open ? "true" : "false");
    sidebar.setAttribute("aria-hidden", open ? "false" : "true");
  }

  function isOpen() {
    return body.classList.contains("sidebar-open");
  }

  // Start closed (requirement)
  setOpen(false);

  _openSidebar = () => setOpen(true);

  btn.addEventListener("click", () => setOpen(!isOpen()));
  backdrop.addEventListener("click", () => setOpen(false));

  // ESC closes (simple + robust)
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && isOpen()) setOpen(false);
  });
}

async function initDbSelector() {
  const sel = document.getElementById("dbSelect");
  const status = document.getElementById("dbSelectStatus");
  if (!sel) return;

  async function refresh() {
    try {
      const r = await fetch("/api/db_list");
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "db_list failed");
      const { dbs, current } = j;

      sel.innerHTML = "";
      (dbs || []).forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });

      if (current) sel.value = current;
      if (status) status.textContent = "";
    } catch (e) {
      console.error("db selector refresh failed", e);
      if (status) status.textContent = "Could not load database list.";
    }
  }

  sel.addEventListener("change", async () => {
    const chosen = sel.value;
    if (!chosen) return;
    if (status) status.textContent = "Switching…";
    try {
      const r = await fetch("/api/db_select", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({db: chosen})
      });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "db_select failed");
      if (status) status.textContent = "";

      // Update the database path display
      const dbPathEl = document.querySelector("#dbpath");
      if (dbPathEl) dbPathEl.textContent = `DB: ${j.db_path}`;

      // Reload the main list & counts against the new DB
      await loadItems();
      await loadCounts();
    } catch (e) {
      console.error("db switch failed", e);
      if (status) status.textContent = (e && e.message) ? e.message : "Switch failed.";
      // Re-sync selector to actual current
      await refresh();
    }
  });

  await refresh();

  const searchInput = document.getElementById("postSearch");
  const searchBtn = document.getElementById("postSearchBtn");
  const searchStatus = document.getElementById("postSearchStatus");
  if (searchInput && searchBtn) {
    const runSearch = async () => {
      const q = searchInput.value.trim();
      if (!q) {
        if (searchStatus) searchStatus.textContent = "Enter a search term first.";
        return;
      }
      searchBtn.disabled = true;
      searchBtn.textContent = "Searching…";
      if (searchStatus) searchStatus.textContent = "";
      try {
        const r = await fetch(`/api/items?q=${encodeURIComponent(q)}&limit=1000`);
        const results = await r.json();
        setItemsAndRender(results);
        const banner = document.getElementById("feedPostsBanner");
        const bannerText = document.getElementById("feedPostsBannerText");
        if (banner && bannerText) {
          bannerText.textContent = `Found ${results.length} post${results.length !== 1 ? "s" : ""} matching "${q}" (ignores read/unread and retention filters).`;
          banner.hidden = false;
        }
      } catch (e) {
        if (searchStatus) searchStatus.textContent = "Search failed.";
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = "Search";
      }
    };
    searchBtn.addEventListener("click", runSearch);
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });
  }
}

function fmtDate(ts){
  const d = new Date(ts*1000);
  return d.toLocaleString();
}

async function loadCounts(){
  const r = await fetch("/api/stats");
  const s = await r.json();
  const c = `feeds=${s.feeds}  unread=${s.unread}  bookmarked=${s.bookmarked}  retention=${s.retention_days}d`;
  const c1 = document.querySelector("#counts"); if (c1) c1.textContent = c;
  const c2 = document.querySelector("#counts2"); if (c2) c2.textContent = c;
  document.querySelector("#schedulerToggle").checked = !!s.scheduler_enabled;
}

function setItemsAndRender(newItems){
  items = newItems;

  // reset state + caches
  selected = 0;
  expandedId = null;
  rowEls = [];
  contentElsById = new Map();
  titleElsById = new Map();
  starElsById = new Map();
  collapseElsById = new Map();
  itemById = new Map();
  for (const it of items) itemById.set(it.id, it);

  renderInitial();
  updateSelectionUI(null, selected);
}

async function loadItems(){
  const filterMode = document.querySelector("#filterMode").value || "unread";
  const r = await fetch(`/api/items?filter=${encodeURIComponent(filterMode)}&limit=1600`);
  setItemsAndRender(await r.json());
  await loadCounts();
}

function renderInitial(){
  const list = document.querySelector("#list");
  list.innerHTML = "";

  const frag = document.createDocumentFragment();

  items.forEach((it, idx) => {
    const div = document.createElement("div");
    div.className = "item";
    div.dataset.idx = String(idx);
    div.dataset.id = String(it.id);

    const title = document.createElement("div");
    title.className = it.read_at ? "title" : "title unread";
    title.textContent = `${it.feed_title}: ${it.title}`;
    if (it.feed_image) {
      const feedThumb = document.createElement("img");
      feedThumb.src = it.feed_image;
      feedThumb.alt = "";
      feedThumb.className = "feed-thumb";
      feedThumb.loading = "lazy";
      feedThumb.onerror = () => { feedThumb.remove(); };
      title.insertBefore(feedThumb, title.firstChild);
    }
    const collapseBtn = document.createElement("button");
    collapseBtn.textContent = "Collapse";
    collapseBtn.className = "collapseBtn";
    collapseBtn.style.marginLeft = "10px";
    collapseBtn.style.display = "none";
    collapseBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      collapseEntry();
    });
    title.appendChild(collapseBtn);

    const meta = document.createElement("div");
    meta.className = "meta";
    const readStatus = it.read_at ? " · ✓ read" : "";
    const authorPart = it.feed_author ? ` · ${it.feed_author}` : "";
    meta.textContent = `${fmtDate(it.published)}  · ${it.month_count} posts/month${authorPart}${readStatus}`;

    const star = document.createElement("span");
    star.className = "star";
    star.textContent = it.bookmarked ? "★" : "☆";
    star.title = "Bookmark (or press B)";
    meta.appendChild(star);

    const postBtn = document.createElement("span");
    postBtn.textContent = "✎";
    postBtn.title = "Send to gRSShopper (select text first to quote it)";
    postBtn.style.cssText = "cursor:pointer; margin-left:8px; user-select:none;";
    postBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const quote = window.getSelection().toString();
      const author = it.author || it.feed_title;
      // Candidate thumbnails: the feed's own thumbnail field (media:thumbnail /
      // enclosure / itunes:image, extracted server-side at ingest) plus any
      // <img> already sitting in the article HTML we have in memory - no
      // extra fetch needed for either.
      const images = [];
      const seenImg = new Set();
      const addImg = (u) => { if (u && /^https?:/.test(u) && !seenImg.has(u)) { seenImg.add(u); images.push(u); } };
      addImg(it.thumbnail);
      try {
        const doc = new DOMParser().parseFromString(it.content_html || "", "text/html");
        doc.querySelectorAll("img").forEach((img) => {
          const iw = parseInt(img.getAttribute("width") || "0", 10);
          const ih = parseInt(img.getAttribute("height") || "0", 10);
          if ((iw && iw < 50) || (ih && ih < 50)) return; // skip obvious tracking pixels/icons
          addImg(img.getAttribute("src"));
        });
      } catch (err) { /* malformed content, skip image scan */ }
      const w = Math.min(Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0), 900);
      const h = Math.min(Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0), 1000);
      const winName = "grsshopper_edit";
      window.open("", winName, `width=${w}, height=${h}`);
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://www.downes.ca/cgi-bin/api.cgi";
      form.target = winName;
      const fields = {
        cmd: "edit", id: "new", table: "post", hub: "feed",
        url: it.link, title: it.title, feed: it.feed_title,
        author: author, quote: quote, images: JSON.stringify(images.slice(0, 8))
      };
      for (const [name, value] of Object.entries(fields)) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = value || "";
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    });
    meta.appendChild(postBtn);

    const content = document.createElement("div");
    content.className = "content";
    // IMPORTANT: do NOT set innerHTML yet (huge performance win)
    // We'll inject content only when expanded.

    div.appendChild(title);
    div.appendChild(meta);
    div.appendChild(content);

    // Click handlers (delegated per-row)
    div.addEventListener("click", (e) => {
      const clickedStar = e.target === star;
      if (clickedStar) return; // star has its own handler
      setSelected(idx);
    });

    title.addEventListener("click", (e) => {
      e.stopPropagation();
      setSelected(idx);
      onTitleClick(it);
    });

    star.addEventListener("click", async (e) => {
      e.stopPropagation();
      await toggleBookmark(it.id);
    });

    rowEls[idx] = div;
    contentElsById.set(it.id, content);
    titleElsById.set(it.id, title);
    starElsById.set(it.id, star);
    collapseElsById.set(it.id, collapseBtn);

    frag.appendChild(div);
  });

  list.appendChild(frag);
}

function setSelected(idx){
  const prev = selected;
  selected = Math.max(0, Math.min(items.length-1, idx));
  updateSelectionUI(prev, selected);
}

function updateSelectionUI(prevIdx, newIdx){
  if (prevIdx !== null && rowEls[prevIdx]) rowEls[prevIdx].classList.remove("selected");
  if (rowEls[newIdx]) {
    rowEls[newIdx].classList.add("selected");
    rowEls[newIdx].scrollIntoView({block:"nearest"});
  }
}

function move(delta){
  if (!items.length) return;
  setSelected(selected + delta);
}

// Expand/collapse helpers without re-rendering whole list
function collapseExpanded(){
  if (expandedId === null) return;
  const content = contentElsById.get(expandedId);
  if (content) content.classList.remove("expanded");
  const cbtn = collapseElsById.get(expandedId);
  if (cbtn) cbtn.style.display = "none";
  expandedId = null;
}

function collapseEntry(){
  collapseExpanded();
}

function expandEntry(entryId, scrollTop=false){
  // collapse previous
  if (expandedId !== null && expandedId !== entryId) collapseExpanded();

  const it = itemById.get(entryId);
  const content = contentElsById.get(entryId);
  if (!it || !content) return;

  expandedId = entryId;

  const cbtn = collapseElsById.get(entryId);
  if (cbtn) cbtn.style.display = "inline-block";

  // Inject HTML only once
  if (!content.dataset.filled) {
    content.innerHTML = it.content_html || "<em>(no content)</em>";
    content.dataset.filled = "1";
  }

  content.classList.add("expanded");

  if (scrollTop) {
    const row = rowEls[selected];
    if (row) row.scrollIntoView({block:"start"});
  }

  // Mark read in background (do not block UI)
  fetch("/api/mark_read", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id: entryId})
  }).then(() => {
    // Update the entry's read status in memory
    if (it) it.read_at = now_ts();

    // Update the title class to remove "unread"
    const titleEl = titleElsById.get(entryId);
    if (titleEl) titleEl.className = "title";

    // Update counts
    loadCounts();
  }).catch(() => {});
}

function onTitleClick(it){
  if (expandedId === it.id) {
    if (it.link) window.open(it.link, "_blank");
    return;
  }
  // Expand and scroll it to the top of the viewport so reading can start right away
  expandEntry(it.id, true);
}

// Bookmark toggle updates only that star (no full render)
async function toggleBookmark(entryId){
  const r = await fetch("/api/toggle_bookmark", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id: entryId})
  });
  const j = await r.json();
  const it = itemById.get(entryId);
  if (it) it.bookmarked = j.bookmarked ? 1 : 0;
  const star = starElsById.get(entryId);
  if (star) star.textContent = (j.bookmarked ? "★" : "☆");
  await loadCounts();
}

document.addEventListener("keydown", (e) => {
  // Disable entry-list keyboard shortcuts when the user is typing in a form field.
  const ae = document.activeElement;
  if (ae) {
    const tag = (ae.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select" || tag === "button" || ae.isContentEditable) {
      return;
    }
  }

  if (e.key === "j" || e.key === "J") {
    // Do nothing if at bottom of list
    if (selected >= items.length - 1) return;

    // Collapse current entry
    collapseExpanded();

    // Move to next and expand
    move(1);
    const it = items[selected];
    if (it) expandEntry(it.id, true);
    e.preventDefault();
    return;
  }
  if (e.key === "k" || e.key === "K") {
    // Do nothing if at top of list
    if (selected <= 0) return;

    // Collapse current entry
    collapseExpanded();

    // Move to previous and expand
    move(-1);
    const it = items[selected];
    if (it) expandEntry(it.id, true);
    e.preventDefault();
    return;
  }
  if (e.key === "Enter") {
    const it = items[selected];
    if (it) onTitleClick(it);
    e.preventDefault();
    return;
  }
  if (e.key === "b" || e.key === "B") {
    // Bookmark applies only to the currently expanded (selected) entry.
    if (expandedId !== null) {
      toggleBookmark(expandedId);
      e.preventDefault();
    }
    return;
  }
});



// Click-to-zoom for images inside feed content: open the image URL in a new tab.
// Uses currentSrc when available (handles srcset), otherwise src.
document.querySelector("#list").addEventListener("click", (e) => {
  const img = e.target && e.target.closest && e.target.closest(".content img");
  if (!img) return;

  // Only when the image is inside an expanded entry (so list navigation still works)
  const contentDiv = img.closest(".content");
  if (!contentDiv || !contentDiv.classList.contains("expanded")) return;

  const url = (img.currentSrc || img.getAttribute("src") || "").trim();
  if (!url) return;

  e.preventDefault();
  e.stopPropagation();
  try {
    window.open(new URL(url, window.location.href).toString(), "_blank");
  } catch {
    window.open(url, "_blank");
  }
}, true);

function setProgressUI(active, checked=0, total=1, updated=0, errors=0, current_url=null, state=null){

  if (!active) {
    prog.style.display = "none";
    prog.value = 0;
    prog.max = 1;
    cancelBtn.hidden = true;
    cancelBtn.disabled = true;
    return;
  }

  const running = (state === "running" || !state);
  cancelBtn.hidden = !running;          // only show while a manual update is running
  cancelBtn.disabled = !running;

  prog.style.display = "inline-block";
  prog.max = Math.max(1, total || 1);

    `${statePart}: checked ${checked}/${total} (updated=${updated}, errors=${errors})${urlPart}`;
  if (s2) s2.textContent = (s1 ? s1.textContent : "");
}

// ===== Feed manager =====
function initFeedManager() {
  const newUrl = document.querySelector("#newFeedUrl");
  const createBtn = document.querySelector("#createFeedBtn");
  const createStatus = document.querySelector("#createFeedStatus");

  const search = document.querySelector("#feedSearch");
  const results = document.querySelector("#feedResults");

  const editor = document.querySelector("#feedEditor");
  const editId = document.querySelector("#editFeedId");
  const editUrl = document.querySelector("#editFeedUrl");
  const editTitle = document.querySelector("#editFeedTitle");
  const editAuthor = document.querySelector("#editFeedAuthor");
  const editImage = document.querySelector("#editFeedImage");
  const saveBtn = document.querySelector("#saveFeedBtn");
  const deleteBtn = document.querySelector("#deleteFeedBtn");
  const editorStatus = document.querySelector("#feedEditorStatus");

  const feedEditorError = document.getElementById("feedEditorError");
  const retryFeedBtn = document.getElementById("retryFeedBtn");
  const openFeedUrlLink = document.getElementById("openFeedUrlLink");
  const showFeedPostsBtn = document.getElementById("showFeedPostsBtn");
  const feedPostsBanner = document.getElementById("feedPostsBanner");
  const feedPostsBannerText = document.getElementById("feedPostsBannerText");
  const feedPostsBannerClose = document.getElementById("feedPostsBannerClose");

  function setEditor(feed) {
    if (!feed) {
      editor.hidden = true;
      editId.value = "";
      editUrl.value = "";
      editTitle.value = "";
      if (editAuthor) editAuthor.value = "";
      if (editImage) editImage.value = "";
      if (editorStatus) editorStatus.textContent = "";
      if (feedEditorError) { feedEditorError.hidden = true; feedEditorError.textContent = ""; }
      if (retryFeedBtn) retryFeedBtn.hidden = true;
      if (openFeedUrlLink) openFeedUrlLink.hidden = true;
      return;
    }
    editor.hidden = false;
    editId.value = String(feed.id || "");
    editUrl.value = feed.url || "";
    editTitle.value = feed.title || "";
    if (editAuthor) editAuthor.value = feed.author || "";
    if (editImage) editImage.value = feed.image || "";
    if (openFeedUrlLink) {
      if (feed.url) { openFeedUrlLink.href = feed.url; openFeedUrlLink.hidden = false; }
      else openFeedUrlLink.hidden = true;
    }
    if (editorStatus) editorStatus.textContent = "";
    if (feedEditorError) {
      if (feed.error_msg || feed.fail_count > 0) {
        const times = feed.fail_count || 1;
        feedEditorError.textContent = (feed.error_msg || "Unknown error") + ` — failed ${times} time${times !== 1 ? "s" : ""}`;
        feedEditorError.hidden = false;
      } else {
        feedEditorError.hidden = true;
        feedEditorError.textContent = "";
      }
    }
    if (retryFeedBtn) retryFeedBtn.hidden = false;
  }

  async function refreshResults(q) {
    const query = (q || "").trim();
    if (!results) return;
    if (!query) {
      results.innerHTML = "";
      return;
    }
    try {
      const r = await fetch(`/api/feeds?q=${encodeURIComponent(query)}&limit=30`);
      const j = await r.json();
      if (!j.ok) {
        results.textContent = "Search failed.";
        return;
      }
      const feeds = j.feeds || [];
      if (feeds.length === 0) {
        results.textContent = "No matches.";
        return;
      }
      // Render as a simple list of buttons
      results.innerHTML = "";
      const ul = document.createElement("div");
      ul.style.display = "flex";
      ul.style.flexDirection = "column";
      ul.style.gap = "6px";
      feeds.forEach(f => {
        const b = document.createElement("button");
        b.type = "button";
        b.style.textAlign = "left";
        b.textContent = (f.title ? f.title + " — " : "") + f.url;
        b.onclick = async () => {
          if (_openFeedEditor) await _openFeedEditor(f.id);
          else if (editorStatus) editorStatus.textContent = "Could not load feed.";
        };
        ul.appendChild(b);
      });
      results.appendChild(ul);
    } catch {
      results.textContent = "Search failed.";
    }
  }

  // Debounced search
  let t = null;
  if (search) {
    search.addEventListener("input", () => {
      if (t) clearTimeout(t);
      t = setTimeout(() => refreshResults(search.value), 200);
    });
  }

  if (createBtn) {
    createBtn.onclick = async () => {
      const u = (newUrl && newUrl.value ? newUrl.value : "").trim();
      if (!u) {
        if (createStatus) createStatus.textContent = "Enter a URL first.";
        return;
      }
      if (createStatus) createStatus.textContent = "Working…";
      try {
        const r = await fetch("/api/feed_create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: u })
        });
        const j = await r.json();
        if (!j.ok) {
          if (createStatus) createStatus.textContent = (j.error || "Create failed.");
          return;
        }
        if (createStatus) createStatus.textContent = j.existing ? "Feed already exists." : "Feed created.";
        setEditor(j.feed);
        // Reload right pane entries and counts
        await loadCounts();
        await loadItems();
      } catch (e) {
        if (createStatus) createStatus.textContent = "Create failed.";
      }
    };
  }

  if (saveBtn) {
    saveBtn.onclick = async () => {
      const id = parseInt(editId.value || "0", 10);
      const url = (editUrl.value || "").trim();
      const title = (editTitle.value || "").trim();
      const author = (editAuthor && editAuthor.value || "").trim();
      const image = (editImage && editImage.value || "").trim();
      if (!id) {
        if (editorStatus) editorStatus.textContent = "No feed selected.";
        return;
      }
      if (!url) {
        if (editorStatus) editorStatus.textContent = "URL required.";
        return;
      }
      if (editorStatus) editorStatus.textContent = "Saving…";
      try {
        const r = await fetch("/api/feed_update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, url, title, author, image })
        });
        const j = await r.json();
        if (!j.ok) {
          if (editorStatus) editorStatus.textContent = (j.error || "Save failed.");
          return;
        }
        if (editorStatus) editorStatus.textContent = "Saved.";
        setEditor(j.feed);
        // Update result list and right pane
        await refreshResults(search ? search.value : "");
        await loadCounts();
        await loadItems();
      } catch {
        if (editorStatus) editorStatus.textContent = "Save failed.";
      }
    };
  }

  if (deleteBtn) {
    deleteBtn.onclick = async () => {
      const id = parseInt(editId.value || "0", 10);
      if (!id) return;
      if (!confirm("Delete this feed? This will also remove its stored entries.")) return;
      if (editorStatus) editorStatus.textContent = "Deleting…";
      try {
        const r = await fetch("/api/feed_delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        });
        const j = await r.json();
        if (!j.ok) {
          if (editorStatus) editorStatus.textContent = (j.error || "Delete failed.");
          return;
        }
        setEditor(null);
        if (editorStatus) editorStatus.textContent = "";
        await refreshResults(search ? search.value : "");
        await loadCounts();
        await loadItems();
      } catch {
        if (editorStatus) editorStatus.textContent = "Delete failed.";
      }
    };
  }

  if (retryFeedBtn) {
    retryFeedBtn.onclick = async () => {
      const id = parseInt(editId.value || "0", 10);
      if (!id) return;
      retryFeedBtn.disabled = true;
      retryFeedBtn.textContent = "Refreshing…";
      try {
        const r = await fetch("/api/feed_retry", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({id})
        });
        const j = await r.json();
        if (!j.ok) {
          if (editorStatus) editorStatus.textContent = j.error || "Refresh failed.";
          retryFeedBtn.disabled = false;
          retryFeedBtn.textContent = "Refresh feed";
          return;
        }
        retryFeedBtn.textContent = "Refresh feed";
        retryFeedBtn.disabled = false;
        if (editorStatus) editorStatus.textContent = "Feed refreshed.";
        const rr = await fetch(`/api/feed/${id}`);
        const jj = await rr.json();
        if (jj.ok) setEditor(jj.feed);
        if (_refreshErrorFeeds) _refreshErrorFeeds();
        await loadItems();
      } catch {
        retryFeedBtn.disabled = false;
        retryFeedBtn.textContent = "Refresh feed";
      }
    };
  }

  if (showFeedPostsBtn) {
    showFeedPostsBtn.onclick = async () => {
      const id = parseInt(editId.value || "0", 10);
      if (!id) return;
      showFeedPostsBtn.disabled = true;
      showFeedPostsBtn.textContent = "Loading…";
      try {
        const r = await fetch(`/api/items?feed_id=${id}&limit=5000`);
        setItemsAndRender(await r.json());
        if (feedPostsBanner && feedPostsBannerText) {
          const title = editTitle.value || "this feed";
          feedPostsBannerText.textContent = `Showing all ${items.length} post${items.length !== 1 ? "s" : ""} for "${title}" (ignores read/unread and retention filters).`;
          feedPostsBanner.hidden = false;
        }
      } catch (e) {
        if (editorStatus) editorStatus.textContent = "Could not load posts.";
      } finally {
        showFeedPostsBtn.disabled = false;
        showFeedPostsBtn.textContent = "Show posts";
      }
    };
  }

  if (feedPostsBannerClose) {
    feedPostsBannerClose.onclick = async () => {
      if (feedPostsBanner) feedPostsBanner.hidden = true;
      await loadItems();
    };
  }

  _openFeedEditor = async (feedId) => {
    try {
      const r = await fetch(`/api/feed/${feedId}`);
      const j = await r.json();
      if (j.ok) {
        setEditor(j.feed);
        editor.scrollIntoView({behavior: "smooth", block: "nearest"});
        editor.classList.remove("highlight");
        // Force reflow so animation restarts if called multiple times
        void editor.offsetWidth;
        editor.classList.add("highlight");
      }
    } catch {}
  };

  // URL discovery on blur of editFeedUrl in the editor
  if (editUrl) {
    let _urlAtFocus = "";
    editUrl.addEventListener("focus", () => { _urlAtFocus = editUrl.value.trim(); });
    editUrl.addEventListener("blur", async () => {
      const current = editUrl.value.trim();
      if (!current || current === _urlAtFocus) return;
      // Only attempt discovery if it looks like a plain website (not already a feed path)
      if (!/^https?:\/\//i.test(current)) return;
      if (editorStatus) editorStatus.textContent = "Checking URL…";
      try {
        const r = await fetch("/api/feed_discover", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({url: current})
        });
        const j = await r.json();
        if (j.ok && j.kind === "discovered") {
          editUrl.value = j.feed_url;
          if (openFeedUrlLink) { openFeedUrlLink.href = j.feed_url; openFeedUrlLink.hidden = false; }
          if (j.title && editTitle && !editTitle.value.trim()) editTitle.value = j.title;
          if (editorStatus) editorStatus.textContent = "RSS/Atom feed found.";
        } else if (j.ok && j.kind === "direct" && j.title) {
          if (editTitle && !editTitle.value.trim()) editTitle.value = j.title;
          if (editorStatus) editorStatus.textContent = "";
        } else {
          if (editorStatus) editorStatus.textContent = "";
        }
      } catch {
        if (editorStatus) editorStatus.textContent = "";
      }
    });
  }

  // start hidden editor
  setEditor(null);
}


function initErrorFeeds() {
  const toggle = document.getElementById("errorFeedsToggle");
  const list = document.getElementById("errorFeedsList");
  const row = document.getElementById("errorFeedsRow");
  if (!toggle || !list || !row) return;

  let open = false;
  let errorCount = 0;

  function updateToggleText() {
    toggle.textContent = open
      ? `Hide error feeds (${errorCount})`
      : `Feed errors: ${errorCount}`;
  }

  async function refresh() {
    try {
      const r = await fetch("/api/feeds_errors");
      const j = await r.json();
      if (!j.ok) return;
      const feeds = j.feeds || [];
      errorCount = feeds.length;
      row.hidden = (errorCount === 0);
      updateToggleText();

      if (!open) return;

      list.innerHTML = "";
      if (errorCount === 0) {
        open = false;
        list.hidden = true;
        return;
      }

      feeds.forEach(f => {
        const item = document.createElement("div");
        item.style.cssText = "background:#fff8f8;border:1px solid #f5c2c2;border-radius:8px;padding:8px 10px;font-size:12px;";

        const titleDiv = document.createElement("div");
        titleDiv.style.cssText = "font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
        titleDiv.textContent = f.title || f.url;
        titleDiv.title = f.url;

        const errDiv = document.createElement("div");
        errDiv.style.cssText = "color:#b91c1c;margin-bottom:6px;";
        errDiv.textContent = (f.error_msg || "Unknown error") + ` — failed ${f.fail_count}×`;

        const actions = document.createElement("div");
        actions.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.textContent = "Edit";
        editBtn.onclick = async () => {
          if (_openFeedEditor) await _openFeedEditor(f.id);
        };

        const retryBtn = document.createElement("button");
        retryBtn.type = "button";
        retryBtn.textContent = "Retry now";
        retryBtn.onclick = async () => {
          retryBtn.disabled = true;
          retryBtn.textContent = "Retrying…";
          try {
            const rr = await fetch("/api/feed_retry", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({id: f.id})
            });
            const jj = await rr.json();
            if (!jj.ok) {
              errDiv.style.color = "#b91c1c";
              errDiv.textContent = jj.error || "Retry failed";
              retryBtn.textContent = "Retry now";
              retryBtn.disabled = false;
              return;
            }
            // Show the result right here rather than refreshing the whole
            // list, so a fixed feed doesn't just vanish out from under you.
            const feed = jj.feed;
            if (feed.fail_count === 0) {
              errDiv.style.color = "#166534";
              errDiv.textContent = "Fixed — feed fetched successfully.";
            } else {
              errDiv.style.color = "#b91c1c";
              errDiv.textContent = (feed.error_msg || "Unknown error") + ` — failed ${feed.fail_count}×`;
            }
            retryBtn.textContent = "Retry now";
            retryBtn.disabled = false;
            await loadCounts();
          } catch {
            retryBtn.textContent = "Error";
            retryBtn.disabled = false;
          }
        };

        actions.appendChild(editBtn);
        actions.appendChild(retryBtn);
        item.appendChild(titleDiv);
        item.appendChild(errDiv);
        item.appendChild(actions);
        list.appendChild(item);
      });
    } catch (e) {
      console.error("refreshErrorFeeds failed", e);
    }
  }

  toggle.addEventListener("click", () => {
    open = !open;
    list.hidden = !open;
    updateToggleText();
    if (open) refresh();
  });

  _refreshErrorFeeds = refresh;

  _expandErrorFeeds = () => {
    if (!open) {
      open = true;
      list.hidden = false;
      updateToggleText();
      refresh();
    }
    row.scrollIntoView({behavior: "smooth", block: "nearest"});
  };

  refresh();
}

// Sidebar wiring
try { initSidebar(); } catch (e) { console.error("initSidebar failed", e); }
try { initDbSelector(); } catch (e) { console.error("initDbSelector failed", e); }
try { initFeedManager(); } catch (e) { console.error("initFeedManager failed", e); }
try { initErrorFeeds(); } catch (e) { console.error("initErrorFeeds failed", e); }

loadItems();

// Populate DB pill on page load
fetch("/api/config").then(r=>r.json()).then(c=>{
  const el = document.querySelector("#dbpath");
  if (el && c.db_path) el.textContent = "DB: " + c.db_path;
}).catch(()=>{});

</script>
</body>
